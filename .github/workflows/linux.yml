name: Linux installer
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s Linux/tests -v
      - run: python3 Linux/package.py --output dist/gunlast-linux-tools.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gunlast-linux-tools-python-${{ matrix.python }}
          path: dist/*
